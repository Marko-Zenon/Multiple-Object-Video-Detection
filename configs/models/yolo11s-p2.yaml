# CH-10 high-resolution variant: YOLO11s with an extra P2/4 (stride 4) detection level.
#
# Layers 0-22 are exactly Ultralytics' yolo11.yaml (scale s), so every pretrained yolo11s tensor keeps its
# name, shape and input. The P2 branch is appended (layers 23-25: upsample the P3 neck output, concat the
# backbone P2/4 feature, C3k2), and Detect reads [P3, P4, P5, P2]. Listing P3 first keeps the Detect hidden
# widths (they follow the first input's channels) equal to the pretrained ones, so the three original
# Detect branches transfer unchanged and only the P2 branch is new (movd/yolo_p2.py, results/yolo_p2/).
# Detect works out each level's stride from a forward pass, so the level order is not assumed ascending.
#
# Derived from ultralytics/cfg/models/11/yolo11.yaml (Ultralytics 8.4.207, AGPL-3.0) and the
# P2 head pattern of ultralytics/cfg/models/v8/yolov8-p2.yaml.

nc: 8
scale: s
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

backbone:
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2 (backbone P2/4 feature)
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]
  - [-1, 1, SPPF, [1024, 5]] # 9
  - [-1, 2, C2PSA, [1024]] # 10

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, C3k2, [512, False]] # 13

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 16 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]] # cat head P4
  - [-1, 2, C3k2, [512, False]] # 19 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]] # cat head P5
  - [-1, 2, C3k2, [1024, True]] # 22 (P5/32-large)

  # New P2 branch (not in the pretrained model)
  - [16, 1, nn.Upsample, [None, 2, "nearest"]] # 23
  - [[-1, 2], 1, Concat, [1]] # 24 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 25 (P2/4-xsmall)

  - [[16, 19, 22, 25], 1, Detect, [nc]] # 26 Detect(P3, P4, P5, P2)
